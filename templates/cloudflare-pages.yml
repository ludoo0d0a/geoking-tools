name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: ludoo0d0a/geoking-ci/.github/workflows/cloudflare-pages.yml@main
    with:
      pages_project_name: MYAPP
    secrets: inherit
