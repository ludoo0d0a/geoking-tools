name: Website screenshots

# Caller-side allowOneBuildAtOnce (also enforced inside geoking-ci reusable workflows).
concurrency:
  group: website-screenshots-${{ github.repository }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      screenshot_locales:
        description: "Roborazzi locales (en,fr or all)"
        required: false
        default: "en,fr"
      copy_only:
        description: "Skip Roborazzi; only run fill_website_screenshots.py"
        required: false
        default: "false"
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches:
      - main
    paths:
      - "androidApp/src/test/**/preview/**"
      - "app/src/test/**/preview/**"
      - "scripts/fill_website_screenshots.py"
      - "website/screenshot-sources.json"
      - "screenshots/**"

permissions:
  contents: write

jobs:
  screenshots:
    uses: ludoo0d0a/geoking-ci/.github/workflows/website-screenshots.yml@main
    with:
      screenshot_locales: ${{ github.event.inputs.screenshot_locales || 'en,fr' }}
      copy_only: ${{ github.event.inputs.copy_only || 'false' }}
    secrets: inherit
