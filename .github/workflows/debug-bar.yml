name: debug-bar

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/debug-bar.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/debug-bar.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile debug-bar
        run: ./gradlew --no-daemon :debug-bar:compileDebugKotlin :debug-bar:assembleDebug
